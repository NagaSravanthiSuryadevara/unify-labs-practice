
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register for DevConf 2026</title>
</head>
<body>

<header><h1>Register for DevConf 2026</h1></header>

<nav><a href="index.html">Home</a></nav>

<main>
<form method="POST" action="#">

<fieldset>
<legend>Personal Information</legend>
<label>First Name <input type="text" required></label>
<label>Last Name <input type="text" required></label>
<label>Email <input type="email" required></label>
<label>Phone <input type="tel"></label>
<label>Date of Birth <input type="date"></label>
</fieldset>

<fieldset>
<legend>Professional Details</legend>
<label>Job Title <input type="text"></label>
<label>Company <input type="text"></label>
<label>Experience <input type="number" min="0" max="50"></label>
</fieldset>

<fieldset>
<legend>Preferences</legend>
<label><input type="radio" name="mode"> In-Person</label>
<label><input type="radio" name="mode"> Virtual</label>
<label><input type="radio" name="mode"> Hybrid</label>
</fieldset>

<label><input type="checkbox" required> I agree to Terms</label><br><br>

<button type="submit">Submit</button>
<button type="reset">Reset</button>

</form>
</main>

<footer><p>© 2026 DevConf</p></footer>

</body>
</html>
